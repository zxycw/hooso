<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結帳 — hoo'so</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  /* 結帳頁專用：讓 variant-btn 可以整張卡片點選，原生 radio 保留但不顯示 */
  .checkout-choice { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .checkout-choice input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .checkout-choice i { font-size: 20px; }
  .checkout-form-grid { display: grid; gap: 12px; }
  .order-summary-rows { margin-bottom: 20px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html">
      <div class="logo">hoo'so</div>
      <span class="logo-sub">行動名片專賣店</span>
    </a>
    <div class="header-icons">
      <a href="cart.html" style="font-size:13px;">返回購物車</a>
    </div>
  </div>
</header>

<div class="cart-page">
  <h1 class="cart-title">結帳資訊</h1>

  <div class="cart-layout">
    <div>
      <div class="option-group">
        <div class="option-label">收件人資訊</div>
        <div class="checkout-form-grid">
          <input class="form-input" placeholder="姓名" id="custName">
          <input class="form-input" placeholder="手機號碼" id="custPhone">
          <input class="form-input" placeholder="Email" id="custEmail">
          <input class="form-input" placeholder="收件地址 / 或超商店名" id="custAddress">
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">送貨方式</div>
        <div class="checkout-form-grid">
          <label class="variant-btn checkout-choice selected" data-group="shipMethod">
            <input type="radio" name="shipMethod" value="home" checked>
            <i class="ti ti-truck-delivery" aria-hidden="true"></i>
            <div class="option-copy"><strong>宅配到家</strong><br><span>黑貓/新竹物流，送到府上</span></div>
          </label>
          <label class="variant-btn checkout-choice" data-group="shipMethod">
            <input type="radio" name="shipMethod" value="cvs_prepaid">
            <i class="ti ti-building-store" aria-hidden="true"></i>
            <div class="option-copy"><strong>超商取貨付款</strong><br><span>7-11 / 全家，貨到超商付現</span></div>
          </label>
          <label class="variant-btn checkout-choice" data-group="shipMethod">
            <input type="radio" name="shipMethod" value="cvs_paid">
            <i class="ti ti-building-store" aria-hidden="true"></i>
            <div class="option-copy"><strong>超商取貨不付款</strong><br><span>7-11 / 全家，先線上付款</span></div>
          </label>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">付款方式</div>
        <div class="checkout-form-grid">
          <label class="variant-btn checkout-choice" data-group="payMethod">
            <input type="radio" name="payMethod" value="linepay">
            <i class="ti ti-brand-line" aria-hidden="true"></i>
            <div class="option-copy"><strong>LINE Pay</strong><br><span>尚未開放，敬請期待</span></div>
          </label>
          <label class="variant-btn checkout-choice selected" data-group="payMethod">
            <input type="radio" name="payMethod" value="ecpay" checked>
            <i class="ti ti-credit-card" aria-hidden="true"></i>
            <div class="option-copy"><strong>信用卡 / ATM / Apple Pay</strong><br><span>由綠界金流處理，跳轉後可選擇實際付款方式</span></div>
          </label>
        </div>
      </div>
    </div>

    <div class="cart-summary">
      <div id="orderSummary" class="order-summary-rows"></div>
      <button class="btn btn-dark btn-block" id="checkoutBtn" onclick="handleCheckout()">確認送出訂單</button>
      <p class="form-hint" style="text-align:center;margin-top:12px;">
        送出後會導向綠界付款頁面，請在同一個分頁完成付款，勿關閉瀏覽器。
      </p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-bottom" style="border-top:none;padding-top:0;">
    <span>© 2026 hoo'so. All rights reserved.</span>
  </div>
</footer>

<script src="js/cart.js"></script>
<script>
// 你的 Apps Script 網頁應用程式網址（結帳用）
const CHECKOUT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxy2-9DuR3dTlvdB3JWwxSsYkiMdNkTQSVjZrteTp1DbzYNd_hqwmxdx8Pm1ztULAGl/exec';

// 讓每組 radio 選項像 product.html 一樣，點選整張卡片會切換 selected 樣式
document.querySelectorAll('.checkout-choice').forEach(label => {
  label.addEventListener('click', () => {
    const group = label.dataset.group;
    document.querySelectorAll(`.checkout-choice[data-group="${group}"]`).forEach(el => {
      el.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input[type="radio"]').checked = true;
  });
});

function renderSummary() {
  const cart = getCart();
  const total = getCartTotal();
  const shipping = total >= 1000 ? 0 : 80;
  document.getElementById('orderSummary').innerHTML = `
    <div class="summary-row"><span>共 ${getCartCount()} 件商品</span><span>${formatPrice(total)}</span></div>
    <div class="summary-row"><span>運費</span><span>${shipping === 0 ? '免運' : formatPrice(shipping)}</span></div>
    <div class="summary-total"><span>應付金額</span><span>${formatPrice(total + shipping)}</span></div>
  `;
}

// 把單一購物車項目組成一段給綠界看的商品說明文字
function buildItemLabel(item) {
  const variantLabel = VARIANT_LABELS[item.variant] || item.variant;
  let colorLabel = '';
  if (item.colorMode === 'solid') {
    colorLabel = COLOR_LABELS[item.color] || item.color;
  } else if (item.colorMode === 'two-tone') {
    colorLabel = `本體${COLOR_LABELS[item.bodyColor] || ''}字${COLOR_LABELS[item.textColor] || ''}`;
  }
  const qty = item.qty || 1;
  return `hoo'so${variantLabel}${colorLabel} x${qty}`;
}

function generateOrderId() {
  // HOOSO + 13碼時間戳，英數字，20字內，綠界要求唯一值
  return 'HOOSO' + Date.now();
}

function handleCheckout() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!name || !phone || !address) {
    alert('請填寫姓名、手機號碼與收件地址');
    return;
  }

  const cart = getCart();
  if (cart.length === 0) {
    alert('購物車是空的');
    return;
  }

  const payMethod = document.querySelector('input[name="payMethod"]:checked').value;
  const shipMethod = document.querySelector('input[name="shipMethod"]:checked').value;

  if (payMethod === 'linepay') {
    alert('LINE Pay 尚未開放，請選擇「信用卡 / ATM / Apple Pay」付款');
    return;
  }

  const total = getCartTotal();
  const shipping = total >= 1000 ? 0 : 80;
  const amount = total + shipping;
  const itemName = cart.map(buildItemLabel).join('#');
  const orderId = generateOrderId();

  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.textContent = '正在導向付款頁面...';

  const params = new URLSearchParams({
    orderId: orderId,
    amount: String(amount),
    itemName: itemName,
    custName: name,
    custPhone: phone,
    custEmail: email,
    custAddress: address,
    shipMethod: shipMethod,
    payMethod: payMethod,
  });

  // 訂單已經記成待付款，這裡先清空購物車，避免使用者返回上一頁重複下單
  saveCart([]);

  window.location.href = CHECKOUT_ENDPOINT + '?' + params.toString();
}

renderSummary();
</script>
</body>
</html>
